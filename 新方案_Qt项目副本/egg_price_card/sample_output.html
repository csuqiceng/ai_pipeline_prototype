* { margin:0; padding:0; box-sizing:border-box; }
body {

/* ── Card Shell ─────────────────────────────────── */
.card {
    width: 360px;
    background: #FFF8F0;

    border: 1.5px solid #D4C4B0;
    box-shadow: 0 3px 16px rgba(120,80,40,0.12);
    overflow: hidden;
}

/* ── Top Band ───────────────────────────────────── */
.card-top {
    background: linear-gradient(180deg, #FFBE76 0%, #F5A623 100%);

    text-align: center;
}
.icon-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

/* ── Table ──────────────────────────────────────── */
.ptable {
    width: 100%;
    border-collapse: collapse;
}
.ptable thead th {
    background: #F0932B;
    color: #FFFFFF;
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 6px;
    text-align: center;
    line-height: 1.45;
    border-bottom: 2px solid #D4851F;
}
.ptable thead th .sub {
    font-size: 11px;
    font-weight: 400;
    opacity: 0.85;
}
.ptable tbody td {
    padding: 9px 6px;
    text-align: center;
    font-size: 13.5px;
    color: #333333;
    border-bottom: 1px solid #EDE0D0;
}
.col-name  { font-weight: 500; }
.col-price { font-variant-numeric: tabular-nums; }
.col-change{ font-variant-numeric: tabular-nums; }
.col-trend { font-weight: 700; }

/* ── Footer ─────────────────────────────────────── */

    padding: 8px 14px;
    font-size: 11.5px;
    color: #8B6914;

}
</style>
