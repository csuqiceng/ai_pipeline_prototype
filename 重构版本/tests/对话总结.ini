下面按“用户说一句话以后，系统怎么分流、怎么执行”来拆。这里说的是**用户页自然语言对话链路**，不是工程师页手工按钮链路。

**总入口**
用户文本/语音最终进入用户页命令处理：

[operator_ui_mixin.py](</c:/Users/a/Desktop/ai_pipeline_prototype/重构版本/robot_modbus_lite/operator_ui_mixin.py:4000>)

```python
def _handle_operator_ui_command(self, text: str) -> bool:
```

这个函数是第一层本地分流。它会先按上下文和确定性规则处理，处理不了才进入后面的 NLP/Agent 解析链路。

整体顺序是：

```text
用户输入
  ↓
_operator_handle_* 本地上下文优先处理
  ↓
如果没命中，再走 Agent / VoiceNlpAdapter
  ↓
生成 VoiceNlpPlan
  ↓
_set_nlp_result_plan / _execute_nlp_plan
  ↓
聊天回答 / 流程草案 / 等待确认 / 执行 / 归档
```

**1. 运行中控制类**
入口优先级很高：

```python
_operator_handle_pending_interruption_command
_operator_handle_running_control_text
_operator_handle_emergency_text
_operator_handle_progress_query
```

典型话术：

```text
暂停
继续
停止
急停 授权码 急停
执行到哪里了
完成了吗
```

路线：

```text
用户输入
→ _handle_operator_ui_command
→ 运行控制 / 急停 / 进度查询本地处理
→ 直接更新状态、日志、聊天回答
```

这类不会先问 DeepSeek，也不会当普通聊天处理。

**2. 等待确认时的对话**
如果当前有待确认计划 `_operator_pending_confirm_plan`，会优先处理确认相关话术。

典型话术：

```text
确认执行
取消
不要执行
速度改成30
把X改成1000
为什么要确认
```

路线：

```text
用户输入
→ _operator_handle_pending_confirm_modify
→ 如果是参数修改，更新待确认计划
→ 如果是确认执行，进入 _operator_confirm_execute
```

确认执行入口：

[operator_ui_mixin.py](</c:/Users/a/Desktop/ai_pipeline_prototype/重构版本/robot_modbus_lite/operator_ui_mixin.py:3451>)

```python
def _operator_confirm_execute(self) -> None:
```

执行前会检查：

```text
确认是否过期
→ L1 安全预检
→ L2 运动规划预演
→ L3 流程预演
→ 执行门禁
→ 真正执行
```

如果任何一步失败：

```text
不执行
→ 聊天回答失败原因
→ 归档 blocked
```

如果通过：

```text
聊天：“确认收到，开始执行。”
→ _execute_nlp_plan
→ NlpMixin 执行动作序列
```

**3. 澄清回答**
如果系统前面问过“请补充坐标/参数”，下一句话优先当作澄清回答。

典型话术：

```text
X1000 Y0 Z800
位置A是1000,0,800,0,90,0
速度50
```

路线：

```text
用户输入
→ _operator_handle_pending_clarification_answer
→ 回填当前 pending plan / flow draft
→ 重新预检或更新草案
→ 聊天回答“已补齐参数”
```

这一步优先级高于普通 NLP，避免用户补参数时被误识别成新命令。

**4. 流程草案编辑**
如果当前存在 `_operator_pending_flow_draft`，很多话会优先解释为“正在编辑这个草案”。

典型话术：

```text
第一步移动到位置A然后移动到home
加一步等待2秒
把第二步速度改成30
删除第三步
保存
保存并执行
这个流程是什么样
```

路线：

```text
用户输入
→ _operator_handle_pending_flow_draft_edit
→ _operator_handle_pending_flow_draft_command
→ _operator_handle_pending_flow_draft_query
```

现在多步拆分已经支持：

```text
第一步 移动到位置a 然后移动到home
```

会拆成：

```text
步骤1：移动到位置A
步骤2：移动到home
```

位置来源现在是：

```text
当前草案 positions
→ position_registry.json
→ query_table.json 里的 Func108 位置模板
```

保存：

```text
保存
→ _operator_save_flow_draft
→ 写 query_table / flows / flow_registry / position_registry
→ 聊天回答保存结果
```

保存并执行：

```text
保存并执行
→ 先保存流程
→ 再进入流程执行确认/执行路径
```

**5. 已保存流程查询/执行**
典型话术：

```text
我有哪些流程
我有那些流程
点头流程是什么样
执行点头流程
运行打招呼
```

路线分两类。

查询类：

```text
用户输入
→ _operator_handle_flow_list_query
→ _operator_handle_context_query
→ 返回流程列表/流程步骤
```

执行类：

```text
用户输入
→ RegisteredFlowAgent 或本地流程执行识别
→ 生成 flow plan
→ 如果需要确认，进入确认卡
→ 确认后 _start_flow
```

流程启动入口：

[flow_execution_mixin.py](</c:/Users/a/Desktop/ai_pipeline_prototype/重构版本/robot_modbus_lite/flow_execution_mixin.py:144>)

```python
def _start_flow(...)
```

启动前检查：

```text
是否已有流程运行
是否选择流程
流程是否为空
步骤模板是否存在
是否包含当前不支持步骤
host 地址是否存在
控制器是否就绪
```

如果通过：

```text
flow_step_index = 0
→ 等待控制器就绪
→ _run_next_flow_step
→ 每步执行
→ 完成/失败归档
```

**6. 位置/模板/状态查询**
典型话术：

```text
位置A参数是什么
home坐标是多少
有哪些模板
当前状态怎么样
报警了吗
为什么只执行了一步
```

路线：

```text
用户输入
→ _operator_handle_context_query
→ _operator_handle_dashboard_query
→ Agent query plan
→ DashboardQueryService / 本地上下文回答
```

位置查询顺序大致是：

```text
当前流程草案里的位置
→ position_registry
→ query_table Func108 模板
```

所以现在：

```text
位置A参数是什么
```

即使 `position_registry` 没有 A，只要 `query_table` 有 `位置A`，也能回答。

**7. 普通执行命令**
典型话术：

```text
小正 移动到位置A
小正 回到home
小正 上升3毫米
小正 Ry正转15度
小正 打开夹爪
```

路线：

```text
用户输入
→ 本地上下文没处理
→ AgentOrchestrator / VoiceNlpAdapter
→ CommandUnderstandingAgent / AtomicTemplateAgent / ParameterCompletionAgent
→ 生成 VoiceNlpPlan
```

如果是可执行动作：

```text
_set_nlp_result_plan
→ 判断是否需要预检
→ 判断是否需要确认
→ 显示确认卡
→ 用户确认
→ _execute_nlp_plan
→ NlpMixin 执行动作序列
```

如果是低风险且策略允许免确认：

```text
_set_nlp_result_plan
→ _execute_nlp_plan
→ 直接执行
```

但大部分运动类会要求确认。

**8. 复杂流程生成**
典型话术：

```text
小正，创建一个打招呼流程，先回home，再小臂上下点头15度3次
帮我编一个A到B再回home的流程
```

路线：

```text
用户输入
→ FlowDraftAgent / VoiceNlpAdapter 复杂流程解析
→ 可能使用 DeepSeek 生成结构化草案
→ action_type = flow_draft
→ _operator_handle_flow_draft_plan
→ 保存到 _operator_pending_flow_draft
→ 聊天展示草案
```

之后用户继续说：

```text
保存
保存并执行
加一步
改第二步
这个流程里面有什么
```

都会优先进入“流程草案上下文”，不会当成新聊天。

**9. 普通聊天 / 知识库问答**
典型话术：

```text
你是谁
你能做什么
为什么要确认
AI会直接控制机械手吗
```

路线：

```text
用户输入
→ 本地命令没命中
→ VoiceNlpAdapter / AssistantKnowledgeBase
→ 如果知识库高置信命中，直接回答
→ 否则 DeepSeek 兜底
→ action_type = chat
→ 聊天回答，不执行机械手
```

知识库文件：

[assistant_knowledge_base.json](</c:/Users/a/Desktop/ai_pipeline_prototype/重构版本/data/assistant_knowledge_base.json>)

它是静态说明知识库，不是执行模板库。

**10. 未识别 / 需要补充**
典型话术：

```text
这个里面有
去那里
移动一下
```

路线：

```text
用户输入
→ 本地没命中
→ Agent / VoiceNLP 也不能形成完整动作
→ action_type = unknown 或 clarification
→ 聊天回答“没识别到动作”或“请补充参数”
→ 不执行
```

关键点：如果当前有流程草案，这类话应优先结合草案上下文；如果没有上下文，容易被 LLM 误判。这也是前面“这个模板里面有”那类问题的根因。

**当前几个重要状态**
系统对话不是无状态的，很多分流取决于这些变量：

```text
_operator_pending_confirm_plan      等待确认的执行计划
_operator_pending_flow_draft        正在编辑的流程草案
_operator_pending_clarification     等待用户补参数
flow_running                        流程是否正在执行
nlp_sequence_running                自然语言动作序列是否执行中
_operator_scene_override            用户页当前场景
_atomic_memory                      速度、步长、位置记忆
position_registry                   示教位置库
table / query_table                 命令模板表
```

所以同一句话在不同状态下路线不同。

例如：

```text
保存
```

无草案时：可能无法识别或普通命令。  
有流程草案时：保存当前草案。

```text
确认
```

无待确认计划时：提示没有待确认内容。  
有待确认计划时：进入执行。

```text
位置A
```

在查询上下文：回答位置参数。  
在流程草案上下文：可能补成移动步骤。  
在执行命令上下文：生成移动到位置A动作。

**一句话总结**
现在的对话系统是“上下文优先”的多层路由：

```text
运行/确认/澄清/流程草案上下文
→ 本地确定性查询和编辑
→ Agent 确定性能力
→ 本地知识库
→ DeepSeek 兜底
→ 统一转换成聊天回答、草案、确认卡或执行动作
```

真正执行机械手前，正常路径都会经过：

```text
计划生成
→ 安全预检
→ 确认
→ 执行
→ 归档
```

普通问答、查询、草案编辑不会直接触发机械手。